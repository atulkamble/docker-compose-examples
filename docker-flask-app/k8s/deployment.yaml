apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: flask-web }
  template:
    metadata:
      labels: { app: flask-web }
    spec:
      containers:
        - name: flask
          image: atuljkamble/docker-flask-app:latest
          ports: [{ containerPort: 5000 }]