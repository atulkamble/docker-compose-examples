services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
  web:
    build: ./web
    image: atuljkamble/docker-flask-postgres-web:latest
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    ports: ["5001:5000"]
    depends_on: [db]
volumes:
  pgdata: