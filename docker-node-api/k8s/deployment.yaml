apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: node-api }
  template:
    metadata:
      labels: { app: node-api }
    spec:
      containers:
        - name: api
          image: atuljkamble/docker-node-api:latest
          ports: [{ containerPort: 3000 }]