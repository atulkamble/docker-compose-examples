apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql }
spec:
  selector: { matchLabels: { app: mysql } }
  replicas: 1
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: root_pass }
            - { name: MYSQL_DATABASE, value: wordpress }
            - { name: MYSQL_USER, value: wp }
            - { name: MYSQL_PASSWORD, value: wp_pass }
          ports: [{ containerPort: 3306 }]